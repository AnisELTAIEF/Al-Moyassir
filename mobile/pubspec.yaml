name: hifidh_quran
description: "Hifidh al-Qur’an — lecture du Coran (riwaya de Qalun), audio et suivi de la mémorisation."
publish_to: 'none'
version: 0.10.0+11

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.1.0
  share_plus: ^13.3.0
  just_audio: ^0.10.0
  path_provider: ^2.1.0
  provider: ^6.1.2
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.3.0
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icône : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0D5C4B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/data/quran_qalun.json
    - assets/data/divisions.json
    - assets/data/mushaf_pages.json
    - assets/data/reciters.json
    - assets/data/tafsir_ibn_kathir.json
    - assets/data/timings/
  fonts:
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
