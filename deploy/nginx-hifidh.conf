# /etc/nginx/sites-available/hifidh  (puis lien dans sites-enabled)
# Remplacez DOMAINE. Le bloc HTTPS est ajouté par certbot (--nginx).
server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    # Admin web (fichiers statiques)
    root /var/www/hifidh-admin;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Version web de l'app (iPhone, navigateur) : /app/ (fichier installé par deploy/install.sh)
    include /etc/nginx/snippets/almoyassir-app.conf;

    # API : /api/xxx -> http://127.0.0.1:8787/xxx
    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    # Page publique des liens d'invitation
    location /invite/ {
        proxy_pass http://127.0.0.1:8787/invite/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
