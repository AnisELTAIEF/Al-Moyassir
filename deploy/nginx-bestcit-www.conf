# /etc/nginx/sites-available/bestcit-www  (puis lien dans sites-enabled)
#
# www.bestconsultingit.com -> site Best CIT (conteneur Docker bcitsite-web sur 127.0.0.1:8081).
# NE PAS toucher au conteneur : ceci n'est qu'un reverse-proxy devant lui.
# Le bloc HTTPS (443) + la redirection 80->443 sont ajoutés par :
#     sudo certbot --nginx -d www.bestconsultingit.com --redirect
# (à lancer une fois que www.bestconsultingit.com résout vers la VM — voir docs/IP-DYNAMIQUE-DUCKDNS.md).
server {
    listen 80;
    listen [::]:80;
    server_name www.bestconsultingit.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
