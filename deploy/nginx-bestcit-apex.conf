# /etc/nginx/sites-available/bestcit-apex  (puis lien dans sites-enabled)
#
# bestconsultingit.com (apex, sans www) -> redirige vers https://www.bestconsultingit.com
# Le bloc HTTPS (443) est ajouté par :
#     sudo certbot --nginx -d bestconsultingit.com --redirect
# Pré-requis : l'apex doit résoudre vers la VM (CNAME @ -> almoyassir.duckdns.org chez Cloudflare,
# en « DNS only », voir docs/IP-DYNAMIQUE-DUCKDNS.md).
server {
    listen 80;
    listen [::]:80;
    server_name bestconsultingit.com;
    return 301 https://www.bestconsultingit.com$request_uri;
}
