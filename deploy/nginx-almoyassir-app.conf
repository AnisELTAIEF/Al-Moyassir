# Version web de l'app (iPhone, iPad, navigateur) : https://DOMAINE/app/
# Installé dans /etc/nginx/snippets/almoyassir-app.conf par deploy/install.sh, et inclus UNE fois
# dans le bloc HTTPS du site « hifidh » (deploy/enable-webapp.sh). Fichiers : /var/www/almoyassir-app/app/
location = /app {
    return 301 /app/;
}
location ^~ /app/ {
    root /var/www/almoyassir-app;
    try_files $uri $uri/ /app/index.html;

    # Noms de fichiers fixes d'une version à l'autre : le navigateur revalide (ETag) à chaque ouverture,
    # pour que les utilisateurs reçoivent toujours la dernière version.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/javascript text/javascript application/json application/wasm application/manifest+json text/css;
}
