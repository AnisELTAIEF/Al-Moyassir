# /etc/apache2/sites-available/hifidh.conf
# Modules requis : a2enmod proxy proxy_http headers rewrite
# Remplacez DOMAINE. Le VirtualHost HTTPS est ajouté par certbot (--apache).
<VirtualHost *:80>
    ServerName DOMAINE
    DocumentRoot /var/www/hifidh-admin

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        /api/    http://127.0.0.1:8787/
    ProxyPassReverse /api/    http://127.0.0.1:8787/
    ProxyPass        /invite/ http://127.0.0.1:8787/invite/
    ProxyPassReverse /invite/ http://127.0.0.1:8787/invite/

    <Directory /var/www/hifidh-admin>
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin
</VirtualHost>
